<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/>
    <!-- th:fragment="styles": main_report.html only pulls ":: styles" for each
         top-level section template (opc/fragments/${section.fragmentName}),
         so this fragment must be named and explicitly pulled in by any
         consuming template's own "styles" fragment (see pc_ppi_classic.html)
         or none of the rules below are ever loaded - the .cdr-*/.ci-* classes
         would be present on the elements but match nothing. -->
    <style th:fragment="styles">

        /* ---- Card block wrapper ---- */
        table.cdr-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin: 0;
            border-top: 0.5pt solid #000000;
            border-bottom: 0.5pt solid #000000;
        }
        tr.cdr { border-bottom: 0.5pt solid #000000; }
        tr.cdr:last-child { border-bottom: none; }
        td.cdr-row-td { padding: 0; }

        /* ---- Data row: "labelFr : value ..........  labelAr" ---- */
        /* Same background-image dot-leader technique as pc_ppi_classic.html's
           div.row.lead (see DOT-LEADER-RULES.md): dots fill the whole row and
           reach exactly from the value to the Arabic label regardless of
           value length, no vertical divider between the two sides. */
        div.cdr-row {
            position: relative;
            height: 1.5em;
            line-height: 1.5em;
            overflow: hidden;
            padding: 2pt 7pt;
        }
        div.cdr-dotsfill {
            position: absolute;
            z-index: 0;
            left: 0;
            top: 1.5mm;
            width: 100%;
            height: 1.25em;
            /* Same 5x9pt tile as pc_ppi_classic.html's div.dotsfill - one
               ~1.2pt gray (#666) anti-aliased dot near the tile's bottom
               edge, inline data URI so no base URI / resource resolver is
               needed by the PDF renderer. */
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAJCAYAAAD6reaeAAAAPElEQVR4nGNgoA1grK+vZyKsKiUlxYKRkbH2w4cPgatXr/7NwMDAwMLMzPzi////2xgYGP4yMDD8x6kdABrWECfJlCgBAAAAAElFTkSuQmCC');
            background-repeat: repeat-x;
            background-position: left bottom;
        }
        span.cdr-lbl {
            position: absolute;
            z-index: 1;
            left: 0;
            top: 1.5mm;
            height: 1.25em;
            line-height: 1.25em;
            white-space: nowrap;
            direction: ltr;
            background-color: #ffffff;
            padding-right: 3pt;
        }
        span.cdr-val { font-weight: 700; }
        span.cdr-arlbl {
            position: absolute;
            z-index: 1;
            right: 0;
            top: 1.5mm;
            height: 1.25em;
            line-height: 1.25em;
            background-color: #ffffff;
            padding-left: 3pt;
            font-family: 'Noto Naskh Arabic', 'Arial Unicode MS', Tahoma, sans-serif;
            font-size: 10pt;
        }

        /* ---- Tag row: 50/50, no dots, no divider ---- */
        tr.cdr-tag { border-bottom: 0.5pt solid #000000; }
        tr.cdr-tag:last-child { border-bottom: none; }
        td.cdr-tag-fr {
            width: 50%;
            padding: 2pt 4pt 2pt 7pt;
            direction: ltr;
            text-align: left;
            vertical-align: middle;
            font-style: italic;
        }
        td.cdr-tag-ar {
            width: 50%;
            padding: 2pt 7pt 2pt 4pt;
            direction: rtl;
            text-align: right;
            vertical-align: middle;
            font-family: 'Noto Naskh Arabic', 'Arial Unicode MS', Tahoma, sans-serif;
            font-size: 10pt;
            font-style: italic;
        }

        /* ---- Full-width mandataire row ---- */
        tr.cdr-full { border-top: 0.5pt solid #000000; }
        td.cdr-full-td {
            padding: 2pt 7pt;
            font-weight: 700;
            direction: ltr;
            text-align: left;
        }

    </style>
</head>
<body>

<!-- Data row: labelFr + bold value on the left, dots filling the rest of
     the row, Arabic label overlaid flush right - no column divider. -->
<tr th:fragment="row(labelFr, value, labelAr)" class="cdr">
    <td class="cdr-row-td" colspan="2">
        <div class="cdr-row">
            <div class="cdr-dotsfill"></div>
            <span class="cdr-lbl">[[${labelFr}]]<span class="cdr-val" th:text="${value != null and !#strings.isEmpty(value)} ? ${value} : ''"></span></span>
            <span class="cdr-arlbl" dir="rtl" th:text="${labelAr}"></span>
        </div>
    </td>
</tr>

<!-- Tag row: 50/50, no dots -->
<tr th:fragment="tagRow(textFr, textAr)" class="cdr-tag">
    <td class="cdr-tag-fr" th:text="${textFr}"></td>
    <td class="cdr-tag-ar" dir="rtl" th:text="${textAr}"></td>
</tr>

<!-- Mandataire row: full width, bold, only shown if not empty -->
<tr th:fragment="mandataireRow(text)" class="cdr-full"
    th:if="${text != null and !#strings.isEmpty(text)}">
    <td class="cdr-full-td" colspan="2" th:text="${text}"></td>
</tr>

</body>
</html>
